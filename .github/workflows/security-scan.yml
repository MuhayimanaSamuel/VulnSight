name: DevSecOps CI/CD Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sast-and-audit:
    name: SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Node Dependency Audit
        run: npm audit --audit-level=high

      - name: TypeScript Static Typecheck
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & SAST
        run: |
          pip install -r services/scanner-engine/requirements.txt
          pip install bandit flake8

      - name: Run Bandit Security Analysis
        run: bandit -r services/scanner-engine/ -ll

  container-security:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sast-and-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t vulnsight-gateway:latest .

      - name: Scan with Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnsight-gateway:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
